name: dbp
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-dbp_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set in db/.env}
      POSTGRES_DB: ${POSTGRES_DB:-dbp}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set in db/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - dbp_pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_OWNER_USER:-dbp_owner} -d ${POSTGRES_DB:-dbp}"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  dbp_pgdata:
