<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Assign and urgent flag</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
</style>
</helmet>
<div style="width: 100%; height: 100%; min-height: 680px; box-sizing: border-box; display: flex; background: #ffffff; color: #1f2933; position: relative">
<aside style="width: 200px; flex-shrink: 0; border-right: 1px solid #9aa5b1; padding: 20px 12px; display: flex; flex-direction: column; gap: 6px; background: #f5f7fa">
<span style="font-size: 16px; font-weight: 700; padding: 0 8px 12px 8px">Buku Pink Demo</span>
<button style="text-align: left; padding: 10px 12px; border: 0; border-radius: 8px; background: #e6f4f2; color: #0f766e; font-size: 14px; font-weight: 600">Queue</button>
<button style="text-align: left; padding: 10px 12px; border: 0; border-radius: 8px; background: transparent; color: #1f2933; font-size: 14px">Patients</button>
<button style="text-align: left; padding: 10px 12px; border: 0; border-radius: 8px; background: transparent; color: #1f2933; font-size: 14px">Activation codes</button>
<button style="text-align: left; padding: 10px 12px; border: 0; border-radius: 8px; background: transparent; color: #1f2933; font-size: 14px">Audit log</button>
</aside>
<main style="flex-grow: 1; padding: 24px; background: #e4e7eb; display: flex; align-items: center; justify-content: center; min-width: 0">
<div style="width: 440px; background: #ffffff; border: 1px solid #9aa5b1; border-radius: 12px; padding: 28px; display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 20px">Assign: A015, Mei Ling (demo)</h2>
<span style="font-size: 13px; color: #52606d">Checked in 09:01 by QR. Waiting.</span>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">Room<select style="padding: 10px; border: 1px solid #9aa5b1; border-radius: 8px; font-size: 15px"><option>Room 1</option><option selected>Room 2</option><option>Room 3</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">Nurse<select style="padding: 10px; border: 1px solid #9aa5b1; border-radius: 8px; font-size: 15px"><option selected>Nurse Aminah (demo)</option><option>Nurse Lim (demo)</option></select></label>
<label style="display: flex; gap: 8px; align-items: center; font-size: 14px"><input type="checkbox" checked>Mark as urgent</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">Reason (required when urgent)<textarea rows="3" style="padding: 10px; border: 1px solid #9aa5b1; border-radius: 8px; font-size: 14px; font-family: inherit" placeholder="Staff note, no clinical details"></textarea></label>
<p style="margin: 0; font-size: 12px; color: #7b8794">Saving calls the mother in her app and writes an audit entry with your name.</p>
<div style="display: flex; justify-content: flex-end; gap: 8px"><button style="padding: 10px 16px; border: 1px solid #9aa5b1; border-radius: 8px; background: #ffffff; font-size: 14px">Cancel</button><button style="padding: 10px 16px; border: 0; border-radius: 8px; background: #0f766e; color: #ffffff; font-size: 14px">Assign and call</button></div>
</div>
</main>
</div>
</x-dc>

</html>
